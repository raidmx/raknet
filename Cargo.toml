[package]
name = "raknet"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Networking
socket2 = { version = "0.5", features = ["all"] }

# Zero-copy bytes
bytes = "1.8"

# Faster mutex
parking_lot = "0.12"

# Bit operations
bitvec = "1.0"

# Error handling
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Array initialization
array-init = "2.1"

[dev-dependencies]
# Testing
tokio-test = "0.4"
criterion = "0.5"

# Logging for examples
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "protocol"
harness = false
